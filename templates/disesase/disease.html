<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plant Disease Detection - AgriHelper</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 {
            color: #176b3a;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .upload-box {
            border: 2px dashed #36a852;
            border-radius: 15px;
            padding: 30px 20px;
            background: #f8fff8;
            margin-bottom: 20px;
        }

        .upload-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
        }

        .preview {
            display: none;
            margin-top: 20px;
        }

        .preview img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #36a852;
        }

        .detect-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #176b3a;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .detect-btn:hover {
            background: #0d512b;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #176b3a;
            text-decoration: none;
            font-weight: bold;
        }

        .info {
            margin-top: 25px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 10px;
            color: #315b3d;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🌿</div>

    <h1>Plant Disease Detection</h1>

    <p class="subtitle">
        Upload a clear image of a plant leaf to detect possible diseases using AI.
    </p>

    <form action="/detect-disease" method="POST" enctype="multipart/form-data">

        <div class="upload-box">

            <div class="upload-icon">📷</div>

            <p style="margin-bottom:15px;">
                Select a plant leaf image
            </p>

            <input
                type="file"
                name="image"
                id="imageInput"
                accept="image/*"
                required
                onchange="previewImage(event)"
            >

            <div class="preview" id="previewBox">
                <img id="previewImage" src="" alt="Selected Leaf">
            </div>

        </div>

        <button type="submit" class="detect-btn">
            🔍 Detect Disease
        </button>

    </form>

    <a href="/user-dashboard" class="back">
        ← Back to Dashboard
    </a>

    <div class="info">
        <strong>Tip:</strong>
        Use a clear image of the leaf with good lighting for better prediction.
    </div>

</div>


<script>

function previewImage(event) {

    const input = event.target;
    const previewBox = document.getElementById("previewBox");
    const previewImage = document.getElementById("previewImage");

    if (input.files && input.files[0]) {

        const reader = new FileReader();

        reader.onload = function(e) {

            previewImage.src = e.target.result;
            previewBox.style.display = "block";

        };

        reader.readAsDataURL(input.files[0]);
    }
}

</script>

</body>
</html>
